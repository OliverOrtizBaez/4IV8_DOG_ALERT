<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

  <!-- Fondo -->
  <div class="bg-overlay"></div>
  <img
    class="bg-foto"
    src="https://images.unsplash.com/photo-1700922180830-009061498903?w=1080&q=80"
    alt="Fondo"
  />

  <!-- Texto esquina inferior izquierda -->
  <div class="corner-text">
    <p class="corner-app">Dog Alert</p>
    <p class="corner-desc">Cada segundo cuenta cuando una mascota está perdida.</p>
  </div>

  <!-- Card de login -->
  <div class="card-wrapper">
    <div class="card">

      <!-- Logo -->
      <div class="logo-block">
        <img src="img/logo.png" alt="DOG ALERT" class="logo-img" />
        <span class="logo-title">DOG ALERT</span>
      </div>

      <!-- Formulario -->
      <form id="login-form" novalidate>

        <div class="field">
          <label for="email">Correo</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="correo@ejemplo.com"
            maxlength="60"
            autocomplete="email"
          />
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="input-password">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              maxlength="32"
              autocomplete="current-password"
            />
            <button type="button" id="toggle-pass" class="toggle-pass" title="Mostrar/ocultar">
              <svg id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="forgot-row">
          <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <p class="error-msg" id="error-msg"></p>

        <button type="submit" class="btn-entrar">Entrar</button>

        <div class="divider">
          <span>o</span>
        </div>

        <!-- Botón Google -->
        <button type="button" class="btn-google" id="btn-google">
          <svg width="18" height="18" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            <path fill="none" d="M0 0h48v48H0z"/>
          </svg>
          Continuar con Google
        </button>

      </form>

      <!-- Registro y volver -->
      <p class="register-link">
        ¿No tienes cuenta?
        <a href="../sing_in/sing_in.html">Regístrate</a>
      </p>
      <a href="../menu_sinusuario/menu_sinusuario.html" class="back-link">Volver al inicio</a>

    </div>
  </div>

  <script src="./js/main.js"></script>
</body>
</html>
