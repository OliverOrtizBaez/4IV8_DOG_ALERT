<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

  <!-- Fondo -->
  <div class="bg-overlay"></div>
  <img
    class="bg-foto"
    src="./img/fondo.png"
    alt="Fondo"
  />

  <!-- Texto esquina inferior izquierda -->
  <div class="corner-text">
    <p class="corner-app">Dog Alert</p>
    <p class="corner-desc">Cada segundo cuenta cuando una mascota está perdida.</p>
  </div>

  <!-- Card de login -->
  <div class="card-wrapper">
    <div class="card">

      <!-- Logo -->
      <div class="logo-block">
        <img src="img/logo.png" alt="DOG ALERT" class="logo-img" />
        <span class="logo-title">DOG ALERT</span>
      </div>

      <!-- Formulario -->
      <form id="login-form" novalidate>

        <div class="field">
          <label for="email">Correo</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="correo@ejemplo.com"
            maxlength="60"
            autocomplete="email"
          />
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="input-password">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              maxlength="32"
              autocomplete="current-password"
            />
            <button type="button" id="toggle-pass" class="toggle-pass" title="Mostrar/ocultar">
              <svg id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="forgot-row">
          <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <p class="error-msg" id="error-msg"></p>

        <button type="submit" class="btn-entrar">Entrar</button>

        <div class="divider">
          <span>o</span>
        </div>

      </form>

      <!-- Registro y volver -->
      <p class="register-link">
        ¿No tienes cuenta?
        <a href="../sing_in/sing_in.html">Regístrate</a>
      </p>
      <a href="../menu_sinusuario/menu_sinusuario.html" class="back-link">Volver al inicio</a>

    </div>
  </div>

  <script src="./js/main.js"></script>
</body>
</html>
