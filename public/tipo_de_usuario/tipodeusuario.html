<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOG ALERT — Tipo de Usuario</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

  <!-- Fondo -->
  <img
    class="bg-foto"
    src="https://images.unsplash.com/photo-1775018057217-452c28eaa377?w=1080&q=80"
    alt="Fondo"
  />
  <div class="bg-overlay"></div>
  <!-- Contenido -->
  <div class="page">

    <h1 class="titulo">Tipo de Usuario</h1>

    <div class="cards-grid">

      <!-- Card Dueño -->
      <button class="tipo-card" id="card-dueno" data-tipo="dueno">
        <img
          src="https://images.unsplash.com/photo-1557495235-340eb888a9fb?w=800&q=80"
          alt="Dueño de perro"
          class="card-foto"
        />
        <div class="card-gradient"></div>

        <div class="card-body">
          <div class="card-icon-row">
            <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            <h2 class="card-titulo">Dueño de Perro</h2>
          </div>
          <p class="card-desc">
            Soy un dueño de una mascota buscando proteger a mi mejor amigo y reportar cualquier incidencia.
          </p>
        </div>

        <div class="check-badge" id="check-dueno">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
        </div>
      </button>

      <!-- Card Rescatador -->
      <button class="tipo-card" id="card-rescatador" data-tipo="rescatador">
        <img
          src="https://images.unsplash.com/photo-1594004844563-536a03a6e532?w=800&q=80"
          alt="Rescatador o Albergue"
          class="card-foto"
        />
        <div class="card-gradient"></div>

        <div class="card-body">
          <div class="card-icon-row">
            <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            <h2 class="card-titulo">Rescatador o Albergue</h2>
          </div>
          <p class="card-desc">
            Mi misión es rescatar, proteger y encontrar un hogar para perros perdidos o en situación de calle.
          </p>
        </div>

        <div class="check-badge" id="check-rescatador">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
        </div>
      </button>

    </div>

    <!-- Advertencia -->
    <p class="advertencia">* Ya no se podrá cambiar el tipo de usuario *</p>

    <!-- Botón continuar -->
    <button class="btn-continuar" id="btn-continuar" disabled>
      Continuar
    </button>

  </div>

  <script src="./js/main.js"></script>
</body>
</html>
