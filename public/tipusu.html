<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegir Tipo de Usuario</title>
    <style>
        /* Estilos Base y Paleta Viva */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1b4b, #312e81, #4338ca);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        /* Contenedor Principal */
        .selection-container {
            background-color: #ffffff;
            color: #1f2937;
            width: 100%;
            max-width: 900px;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
        }

        .selection-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            text-transform: uppercase;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .selection-header p {
            color: #6b7280;
            font-size: 1rem;
            margin-bottom: 35px;
        }

        /* Contenedor de las dos opciones (Cards) */
        .cards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 35px;
        }

        /* Estructura de cada opción */
        .user-card {
            background-color: #f9fafb;
            border: 3px solid #e5e7eb;
            border-radius: 18px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .user-card:hover {
            transform: translateY(-5px);
            border-color: #a855f7;
            background-color: #f3e8ff;
        }

        /* Galería de 2 imágenes por opción */
        .card-gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            margin-bottom: 20px;
        }

        .card-gallery img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 10px;
            background-color: #e5e7eb;
            border: 1px solid #d1d5db;
        }

        .user-card h2 {
            font-size: 1.4rem;
            color: #111827;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .user-card p {
            font-size: 0.9rem;
            color: #4b5563;
            line-height: 1.5;
            text-align: center;
        }

        /* Alerta en GRANDE abajo (Requerido) */
        .alert-warning-text {
            font-size: 1.3rem;
            font-weight: 800;
            color: #dc2626;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 25px 0;
            padding: 10px;
            border: 2px dashed #fca5a5;
            border-radius: 10px;
            background-color: #fef2f2;
            display: inline-block;
            width: 100%;
        }

        /* Lógica de Selección (Manejo con CSS nativo usando Radio Buttons ocultos) */
        .user-radio {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        /* Efecto visual cuando una opción es seleccionada */
        .user-radio:checked + .user-card {
            border-color: #6366f1;
            background-color: #eef2ff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
        }

        /* Botón de Aceptar en Medio (Aparece dinámicamente o se activa al seleccionar) */
        .action-space {
            margin-top: 20px;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-accept-redirection {
            padding: 15px 40px;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-accept-redirection:hover {
            background: linear-gradient(90deg, #4f46e5, #9333ea);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
            transform: scale(1.03);
        }

        /* Responsividad para pantallas móviles */
        @media (max-width: 768px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
            .selection-container {
                padding: 25px 20px;
            }
            .alert-warning-text {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- El formulario completo apunta a menu directamente al presionar Aceptar -->
    <form action="menu.html" method="GET" class="selection-container">
        
        <header class="selection-header">
            <h1>Elige un Tipo de Usuario</h1>
            <p>Selecciona el perfil que mejor se adapte a tus necesidades dentro de la plataforma</p>
        </header>

        <!-- Bloque de Selección -->
        <div class="cards-grid">
            
            <!-- Opción 1: Dueño de Perros -->
            <label>
                <input type="radio" name="user_type" value="owner" class="user-radio" required>
                <div class="user-card">
                    <!-- Galería de 2 imágenes solicitadas -->
                    <div class="card-gallery">
                        <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=400&auto=format&fit=crop&q=60" alt="Dueño paseando">
                        <img src="https://images.unsplash.com/photo-1534361960057-19889db9621e?w=400&auto=format&fit=crop&q=60" alt="Mascota en casa">
                    </div>
                    <h2>Dueño de Perros</h2>
                    <p>Reporta la pérdida de tus animales de compañía, gestiona sus folios del RUAC y haz un seguimiento activo de la búsqueda dentro de los mapas y alertas vecinales de la alcaldía.</p>
                </div>
            </label>

            <!-- Opción 2: Albergue o Rescatadores -->
            <label>
                <input type="radio" name="user_type" value="shelter" class="user-radio">
                <div class="user-card">
                    <!-- Galería de 2 imágenes solicitadas -->
                    <div class="card-gallery">
                        <img src="https://images.unsplash.com/photo-1548199973-03cce0bbc87b?w=400&auto=format&fit=crop&q=60" alt="Albergue de animales">
                        <img src="https://images.unsplash.com/photo-1601758228041-f3b2795255f1?w=400&auto=format&fit=crop&q=60" alt="Rescate de canino">
                    </div>
                    <h2>Albergue / Rescatador</h2>
                    <p>Registra perros encontrados en la vía pública, administra el espacio de resguardo temporal y cruza datos con las alertas vigentes de los dueños para coordinar devoluciones exitosas.</p>
                </div>
            </label>

        </div>

        <!-- Mensaje de advertencia obligatorio en GRANDE abajo -->
        <div class="alert-warning-text">
            ¡ATENCIÓN! No se podrá cambiar el tipo de usuario una vez seleccionado y confirmado.
        </div>

        <!-- Espacio inferior con el botón central para redireccionar a inicio.html -->
        <div class="action-space">
            <button type="submit" class="btn-accept-redirection">Aceptar y Continuar</button>
        </div>

    </form>

</body>
</html>
