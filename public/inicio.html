<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <style>
        /* Estilos Base y Reinicio */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Contenedor Split (Basado en Group 1.jpg) */
        .login-container {
            background-color: #ffffff;
            display: flex;
            width: 100%;
            max-width: 950px;
            min-height: 550px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        /* Sección Izquierda: Imagen/Ilustración */
        .login-visual {
            flex: 1;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 40px;
            position: relative;
        }

        /* Elemento decorativo simulando el marcador del wireframe */
        .visual-placeholder {
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            width: 100%;
            max-width: 280px;
        }

        .login-visual h2 {
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .login-visual p {
            font-size: 0.95rem;
            opacity: 0.9;
            text-align: center;
            line-height: 1.5;
        }

        /* Sección Derecha: Formulario */
        .login-content {
            flex: 1;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-header {
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 2.2rem;
            color: #111827;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .login-header p {
            color: #6b7280;
            font-size: 0.95rem;
            margin-top: 5px;
        }

        /* Formulario y Campos */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background-color: #f9fafb;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4f46e5;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        /* Opciones extras (Recordar/Olvidar) */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.85rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #4b5563;
            cursor: pointer;
        }

        .forgot-password {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* Botón de envío */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #111827;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #1f2937;
        }

        /* Footer de la tarjeta */
        .login-footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.9rem;
            color: #6b7280;
        }

        .login-footer a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        /* Adaptabilidad Móvil */
        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
                max-width: 450px;
            }
            .login-visual {
                display: none; /* Oculta la parte visual en pantallas pequeñas */
            }
            .login-content {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>

    <main class="login-container">
        
        <section class="login-visual">
            <div class="visual-placeholder">
                <h2>Comunidad</h2>
                <p>Conectando y protegiendo a los que más nos importan en tu localidad.</p>
            </div>
        </section>

        <section class="login-content">
            <header class="login-header">
                <h1>Iniciar Sesión</h1>
                <p>Por favor, introduce tus datos para continuar</p>
            </header>

            <form action="menu.html" method="GET">
                <div class="form-group">
                    <label for="username">Usuario o Correo Electrónico</label>
                    <input type="text" id="username" name="username" placeholder="Introduce tu usuario" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember"> Recordarme
                    </label>
                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-submit">Iniciar Sesión</button>
            </form>

            <footer class="login-footer">
                ¿No tienes una cuenta? <a href="crearc.html">Crear cuenta</a>
            </footer>
        </section>

    </main>

</body>
</html>
