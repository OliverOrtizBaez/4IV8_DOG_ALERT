<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <style>
        /* Estilos Base y Paleta de Colores Viva */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 30px 20px;
        }

        /* Contenedor de la Tarjeta */
        .register-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 650px;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        /* Línea de color decorativa en la parte superior */
        .register-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #10b981, #3b82f6, #8b5cf6);
        }

        /* Encabezado y Bloque de Foto (Estructura de Group 1.jpg) */
        .register-header-block {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            gap: 20px;
        }

        .title-area h1 {
            font-size: 2.4rem;
            color: #111827;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .title-area p {
            color: #6b7280;
            font-size: 0.95rem;
            margin-top: 4px;
        }

        /* Contenedor del Avatar / Foto de Perfil del Wireframe */
        .avatar-uploader {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .avatar-preview {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background-color: #f3f4f6;
            border: 3px dashed #6366f1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6366f1;
            font-weight: bold;
            font-size: 0.8rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .avatar-preview:hover {
            background-color: #eef2ff;
            transform: scale(1.05);
        }

        /* Formulario dispuesto en Grid para organizar los parámetros */
        .register-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background-color: #f9fafb;
        }

        /* Enfoques coloridos e interactivos */
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #a855f7;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.15);
        }

        /* Términos y condiciones */
        .terms-block {
            grid-column: span 2;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            font-size: 0.85rem;
            color: #4b5563;
        }

        .terms-block input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #a855f7;
            cursor: pointer;
        }

        /* Botón de Registro Llamativo */
        .btn-register {
            grid-column: span 2;
            padding: 14px;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
            transition: all 0.3s ease;
        }

        .btn-register:hover {
            background: linear-gradient(90deg, #4f46e5, #9333ea);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4);
            transform: translateY(-1px);
        }

        /* Enlace de regreso */
        .register-footer {
            grid-column: span 2;
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #6b7280;
        }

        .register-footer a {
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
        }

        .register-footer a:hover {
            text-decoration: underline;
        }

        /* Responsividad para pantallas angostas */
        @media (max-width: 600px) {
            .register-form {
                grid-template-columns: 1fr;
            }
            .full-width, .form-group, .terms-block, .btn-register, .register-footer {
                grid-column: span 1;
            }
            .register-header-block {
                flex-direction: column-reverse;
                align-items: flex-start;
            }
            .avatar-uploader {
                align-self: center;
            }
        }
    </style>
</head>
<body>

    <main class="register-container">
        
        <!-- Bloque Superior: Título + Avatar del usuario -->
        <div class="register-header-block">
            <div class="title-area">
                <h1>Crear Cuenta</h1>
                <p>Completa tus datos para formar parte de la red.</p>
            </div>
            
            <!-- Representación del recuadro de usuario a la derecha según el wireframe -->
            <div class="avatar-uploader">
                <div class="avatar-preview">
                    + Foto
                </div>
            </div>
        </div>

        <form id="registerForm" class="register-form">
    
    <div class="form-group">
        <label for="firstname">Nombre(s)</label>
        <input type="text" id="firstname" name="firstname" placeholder="Tu nombre" required>
    </div>

    <div class="form-group">
        <label for="lastname">Apellidos</label>
        <input type="text" id="lastname" name="lastname" placeholder="Tus apellidos" required>
    </div>

    <div class="form-group full-width">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
    </div>

    <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required>
    </div>

    <div class="form-group">
        <label for="confirm-password">Confirmar Contraseña</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="Repite tu contraseña" required>
    </div>

    <div class="form-group full-width">
        <label for="location">Ubicación / Alcaldía o Municipio</label>
        <input type="text" id="location" name="location" placeholder="Ej. Benito Juárez, CDMX">
    </div>

    <div class="terms-block" style="display: flex; align-items: center; gap: 8px; margin-bottom: 20px;">
        <input type="checkbox" id="terms" name="terms" required>
        
        <label style="font-size: 14px; color: #4b5563;">
            Acepto los <a href="term.html" style="color: #4f46e5; text-decoration: none; font-weight: 600;">Términos de Servicio y las Políticas de Privacidad</a>.
        </label>
    </div>

    <button type="button" onclick="validarRegistro()" class="btn-register">Continuar</button>

    <footer class="register-footer">
        ¿Ya tienes una cuenta? <a href="inicio.html">Inicia sesión aquí</a>
    </footer>
</form>

<script>
function validarRegistro() {
    const fields = ['firstname', 'lastname', 'email', 'password', 'confirm-password'];
    let formValido = true;

    // Verificar que los campos obligatorios tengan texto
    fields.forEach(id => {
        const input = document.getElementById(id);
        if (!input.value) {
            formValido = false;
        }
    });

    if (!formValido) {
        alert("Por favor, rellena todos los campos obligatorios.");
        return;
    }

    // Comprobar contraseñas iguales
    const pass = document.getElementById('password').value;
    const confirmPass = document.getElementById('confirm-password').value;
    if (pass !== confirmPass) {
        alert("Las contraseñas no coinciden.");
        return;
    }

    // Verificar el checkbox de términos
    const terms = document.getElementById('terms');
    if (!terms.checked) {
        alert("Debes aceptar los Términos de Servicio y las Políticas de Privacidad.");
        return;
    }

    // Redirección exitosa a menu.html
    window.location.href = 'tipusu.html';
}
</script>

    </main>

</body>
</html>
