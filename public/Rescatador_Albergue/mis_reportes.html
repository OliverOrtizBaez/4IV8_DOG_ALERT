<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mis Reportes – Dog Alert</title>
<link rel="stylesheet" href="./css/mis_reportes.css">
</head>
<body>

<!-- Header -->
<div class="header">
  <button class="btn-back" onclick="history.back()">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
  </button>
  <div class="header-text">
    <h1>Mis Reportes</h1>
    <p>Los reportes expiran automáticamente a los 60 días</p>
  </div>
</div>

<!-- Content -->
<div class="content" id="content"></div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-head-left">
        <span id="modal-icon"></span>
        <span class="modal-title" id="modal-title"></span>
      </div>
      <button class="btn-close-modal" onclick="closeModal()">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <p class="modal-msg" id="modal-msg"></p>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">Cancelar</button>
      <button class="modal-confirm" id="modal-confirm-btn">Confirmar</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="./js/misreportes.js"></script>
</body>
</html>
